# This contains the anti-cheat related configurations.

# This prefix is used in all Boar messages.
prefix: "&3Boar &7>&r "

# How many ticks of history are contained in the client's rolling window for use when receiving corrections.
# At 20 ticks per second a history size of 40 means that a correction could still be processed with rewind with
# two seconds of two-way latency
# NOTE: This is not "that" important on Boar.
player-rewind-history-size-ticks: 20
  
# This is the tolerance of discrepancies between the Client and Server Player position. This helps prevent sending corrections too frequently
# NOTE: Again, Boar can handle small offset just fine and does account for lag, however keep in mind that Boar can't handle (that well)
# any offset smaller than 5.0E-5
player-position-acceptance-threshold: 1.0E-4

# How far (in blocks per tick) the server position can move towards the client position when the two are out of sync,
# but the difference is still too small to send a correction.
# A small and constant difference (usually caused by collisions) can grow until Boar must send a correction, which the
# player sees as a rubberband. This drift removes the difference slowly, so no correction is necessary.
# The drift applies only to the X and Z axes. The Y axis stays as Boar predicts it, because a vertical drift can help
# flight cheats.
# To disable the drift, set this to 0.
# NOTE: This only takes effect for differences below "differ-till-alert", because any larger difference gets a correction.
player-position-drift-amount: 0.0

# A small difference between the client and server position can grow into a correction when collision logic differs (ex: when running into the
# edge/corner of a block, if the position difference is high enough it can cause a large difference since the prediction could move on X-axis
# whilst client moves it's Z-axis)
# Before Boar sends out a correction, it can run the simulation again from the client's last position, and keeps that second
# result (and sends no correction) only if all of these are true:
# - The client's last position was not inside a block.
# - The second run hit blocks differently than the first run (collision, ground, or step up).
# - The second run agrees with the collision flags the client sent.
# - The second run ends at most "player-position-retry-max-offset" blocks from the client position.
# - The client's last position is at most "player-position-retry-max-start-offset" blocks from Boar's.
# - No retry was kept in the last "player-position-retry-cooldown-ticks" ticks, and this isn't a knockback tick.
# A cheater can gain at most the start difference plus "player-position-retry-max-offset" each time a retry is kept (only if they're colliding
# with blocks) but the benefit is that you avoid a correction which could be priority for some servers.
# To disable the retry, set "player-position-retry-enabled" to false or "player-position-retry-max-offset" to 0
player-position-retry-enabled: true
player-position-retry-max-offset: 0.0

# The client's last position is never checked, so without this cap a client could claim any start and have one normal-looking
# tick from there accepted (ignore a correction, then get retried to wherever it is). 0.6 is above every legit retry seen so far.
player-position-retry-max-start-offset: 0.6

# How many ticks after a kept retry before another one can be kept. Legit retries are rare, so this limits how often a cheater
# can gain the start difference. 0 means no cooldown.
player-position-retry-cooldown-ticks: 20

# This is the max reach that Boar going to tolerance before flagging, it does account for lag so no worry :)
max-tolerance-compensated-reach: 3.005

# How many discrepancies between the Client and Server Player position needed to be before the anticheat send alert message
# NOTE: This is NOT tolerance of discrepancies (that's player-position-acceptance-threshold), this will still do silent
# correction unless you change player-position-acceptance-threshold.
# This configuration exists so that some falses or other stuff won't keep spamming the chat/logs.
differ-till-alert: 0.0

# Checks that you want Boar to disable.
# Check name should be in format "Name-Type" and if there is no type then "Name", ex: Reach-A (don't actually disable reach check lol).
disabled-checks: []

# Disable every anti-cheat mitigation while continuing to run checks and report violations.
# This allows detected actions to reach the server without Boar cancelling packets, correcting blocks, rewinding movement, or kicking players.
# This is the default each player starts with; mitigations are tracked per-player, so an integration can override
# BoarPlayerManager#shouldDisableMitigations to split players into arms (ex: A/B testing corrections) or flip a single
# player at runtime with BoarPlayer#setDisableMitigations.
disable-mitigations: false

# How long do we wait for player to respond to latency confirmation/acknowledgements till we kicked the player for timed out.
# This value shouldn't be too low to account for lagging player and shouldn't be too high so cheaters won't be able to stop responding to latency for too long.
max-latency-wait: 15000

# How much balance advantage (in milliseconds) player can gain before the anticheat forcefully set player back (regardless if the player is lagging or not)
# This is to prevent lagging player (or cheaters pretend to be one) gain too much advantage by.... lagging.
# To disable (which you probably shouldn't), set this to any value smaller or equals to 0.
max-balance-advantage: 8500

# Should debug mode be enabled or not?
debug-mode: false
